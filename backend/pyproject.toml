[project]
name = "crebry-research-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4==4.15.0",
  "chromadb==1.5.9",
  "clerk-backend-api==7.0.0",
  "fastapi==0.142.4",
  "httpx==0.28.1",
  "langchain-google-genai==4.4.0",
  "langchain-text-splitters==1.1.3",
  "langgraph==1.2.14",
  "numpy==2.5.3",
  "psycopg[binary]>=3.2,<4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pymupdf==1.28.2",
  "python-docx==1.2.0",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.32",
  "SQLAlchemy==2.1.4",
  "uvicorn==0.54.0"
]

[project.optional-dependencies]
local = ["sentence-transformers==5.7.0", "torch==2.14.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10", "uv==0.13.1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.uv]
build-constraint-dependencies = ["setuptools==84.0.0", "wheel==0.48.0", "packaging==26.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

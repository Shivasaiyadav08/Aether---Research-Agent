services:
  - type: web
    name: Aether-ResearchAgent
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_DIR
        value: /var/data/crebry
      - key: DATABASE_URL
        sync: false
      - key: VECTOR_PROVIDER
        value: supabase
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: crebry-documents
      - key: GEMINI_PROJECT_ID
        sync: false
      - key: GEMINI_FREE_PROJECT_CONFIRMED
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: ANONYMIZED_TELEMETRY
        value: "False"
      - key: TOKENIZERS_PARALLELISM
        value: "false"

services:
  - type: web
    name: Aether-ResearchAgent
    runtime: python
    buildCommand: pip install -r backend/requirements.lock.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: ANONYMIZED_TELEMETRY
        value: "False"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
